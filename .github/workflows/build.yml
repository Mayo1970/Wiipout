name: Build Wiipeout (Wii)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:20261102

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build boot.dol
        run: |
          # Prepend devkitPPC tools explicitly so the image's default PATH cannot shadow them
          export PATH=/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH
          make PLATFORM=WII -j$(nproc)

      - name: Upload boot.dol
        uses: actions/upload-artifact@v4
        with:
          name: wiipeout-boot-dol
          path: build/wii/boot.dol
          if-no-files-found: error
